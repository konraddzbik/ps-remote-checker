name: PS Remote Helper
version: "1.1.0"
slug: ps_remote_helper
description: Home helper for live PS5 Remote Play / PS Portal connection tests (PS Remote Checker)
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
# Host network: needed to find the PS5 (UDP broadcast) and the router (UPnP multicast) on the LAN,
# and so the helper's UDP traffic gets the same NAT treatment as the PS5's.
host_network: true
ingress: true
ingress_port: 8099
panel_icon: mdi:sony-playstation
panel_title: PS Remote
homeassistant_api: false
hassio_api: false
options:
  pairing_code: ""
  relay: "https://ntfy.sh"
  ps5_ip: ""
  self_check_speed_test: true
schema:
  pairing_code: "match(^$|^[A-Za-z0-9]{4}-?[A-Za-z0-9]{4}-?[A-Za-z0-9]{4}$)"
  relay: url
  ps5_ip: "match(^$|^[0-9.]+$)"
  self_check_speed_test: bool
